name: Update AUR Package

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-aur-package
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Brave Origin release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm curl jq
              groupadd -g "$HOST_GID" builder || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" builder
              runuser -u builder -- ./scripts/update-package.sh
            '

      - name: Commit GitHub mirror update
        id: mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No package update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add PKGBUILD .SRCINFO
          pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          git commit -m "Update brave-origin-bin to ${pkgver}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not set." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/aur
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: Push to AUR
        run: |
          tmpdir="$(mktemp -d)"
          git clone ssh://aur@aur.archlinux.org/brave-origin-bin.git "$tmpdir"
          cp PKGBUILD .SRCINFO brave-origin-bin.sh "$tmpdir/"
          cd "$tmpdir"
          if git diff --quiet; then
            echo "AUR already current."
            exit 0
          fi
          git config user.name "Aditya Hebballe"
          git config user.email "adityahebbale@gmail.com"
          git add PKGBUILD .SRCINFO brave-origin-bin.sh
          pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          git commit -m "Update to ${pkgver}"
          git push
