name: Update AUR Package

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git curl jq openssh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Check for Brave Origin release
        run: runuser -u builder -- ./scripts/update-package.sh

      - name: Commit GitHub mirror update
        id: mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No package update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add PKGBUILD .SRCINFO
          pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          git commit -m "Update brave-origin-bin to ${pkgver}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure AUR SSH
        if: ${{ steps.mirror.outputs.changed == 'true' }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/aur
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: Push to AUR
        if: ${{ steps.mirror.outputs.changed == 'true' }}
        run: |
          tmpdir="$(mktemp -d)"
          git clone ssh://aur@aur.archlinux.org/brave-origin-bin.git "$tmpdir"
          cp PKGBUILD .SRCINFO brave-origin-bin.sh "$tmpdir/"
          cd "$tmpdir"
          git config user.name "Aditya Hebballe"
          git config user.email "adityahebbale@gmail.com"
          git add PKGBUILD .SRCINFO brave-origin-bin.sh
          pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          git commit -m "Update to ${pkgver}"
          git push
